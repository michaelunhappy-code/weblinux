<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOI Linux Web</title>

    <script src="./coi-serviceworker.min.js"></script>

    <link
        rel="stylesheet"
        href="https://unpkg.com/@xterm/xterm@5.5.0/css/xterm.css"
    >

    <style>
        html,
        body
        {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #111;
            overflow: hidden;
        }

        #loading
        {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            background: #111;
            color: white;
            font-family: monospace;
            z-index: 10;
        }

        #terminal
        {
            width: 100%;
            height: 100%;
        }

        .title
        {
            font-size: 28px;
            margin-bottom: 20px;
        }

        .status
        {
            font-size: 16px;
            opacity: 0.8;
        }
    </style>
</head>

<body>

<div id="loading">
    <div class="title">NOI Linux</div>
    <div class="status" id="status">
        正在启动 Linux...
    </div>
</div>

<div id="terminal"></div>

<script src="./load.js"></script>

<script type="module">

import "https://unpkg.com/xterm@5.3.0/lib/xterm.js";
import "https://unpkg.com/xterm-pty/index.js";

import "./arg-module.js";

import initEmscriptenModule from "./out.js";

const status = document.getElementById("status");
const loading = document.getElementById("loading");

const terminal = new Terminal({
    cursorBlink: true,
    fontSize: 16,
    fontFamily: "Consolas, monospace",
    scrollback: 5000
});

terminal.open(document.getElementById("terminal"));

status.innerText = "正在创建虚拟终端...";

const { master, slave } = openpty();

terminal.loadAddon(master);

Module.pty = slave;

Module.mainScriptUrlOrBlob =
    new URL("./out.js", window.location.href).href;

const info =
    "t:" + Math.round(Date.now() / 1000) + "\n";

Module.preRun.push((mod) => {
    try
    {
        mod.FS.mkdir("/pack");
    }
    catch (e)
    {
    }

    mod.FS.writeFile("/pack/info", info);
});

const callbacks = [];

Module.pty.onReadable(() => {
    for (const callback of callbacks)
    {
        callback();
    }

    callbacks.length = 0;
});

Module.preRun.push((mod) => {

    mod.TTY.stream_ops.poll =
        (stream, timeout, notifyCallback) => {

            if (Module.pty.readable)
            {
                return 1;
            }

            if (notifyCallback != null)
            {
                callbacks.push(notifyCallback);
            }

            return 0;
        };
});

status.innerText =
    "正在启动 Ubuntu 20.04...";

try
{
    await initEmscriptenModule(Module);

    loading.style.display = "none";
}
catch (e)
{
    status.innerText =
        "NOI Linux 启动失败：" + e;

    console.error(e);
}

</script>

</body>
</html>
