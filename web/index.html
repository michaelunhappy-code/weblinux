<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOI Linux Web</title>

    <script src="./coi-serviceworker.min.js"></script>

    <link
        rel="stylesheet"
        href="https://unpkg.com/@xterm/xterm@5.5.0/css/xterm.css"
    >

    <style>
        html,
        body
        {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #111;
            overflow: hidden;
        }

        #terminal
        {
            width: 100%;
            height: 100%;
        }

        #loading
        {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: #111;
            color: white;
            font-family: Consolas, monospace;
            z-index: 1000;
        }

        #title
        {
            font-size: 30px;
            font-weight: bold;
            margin-bottom: 24px;
        }

        #status
        {
            font-size: 16px;
            margin-bottom: 16px;
            text-align: center;
        }

        #bar
        {
            width: 420px;
            max-width: 80vw;
            height: 10px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
        }

        #progress
        {
            width: 0%;
            height: 100%;
            background: #ddd;
            transition: width 0.2s;
        }

        #detail
        {
            margin-top: 12px;
            font-size: 13px;
            opacity: 0.75;
            max-width: 80vw;
            text-align: center;
            word-break: break-all;
        }
    </style>
</head>

<body>

<div id="loading">
    <div id="title">NOI Linux</div>
    <div id="status">正在准备启动环境...</div>

    <div id="bar">
        <div id="progress"></div>
    </div>

    <div id="detail"></div>
</div>

<div id="terminal"></div>

<script>
var Module = window.Module = window.Module || {};

const statusElement =
    document.getElementById("status");

const detailElement =
    document.getElementById("detail");

const progressElement =
    document.getElementById("progress");

// 需要加载的大文件列表
const RESOURCE_FILES = [
    "qemu-system-x86_64.wasm",
    "qemu-system-x86_64.data"
];

function getBaseUrl()
{
    return new URL("./", window.location.href);
}

Module.locateFile = function(path)
{
    return new URL(path, getBaseUrl()).href;
};

Module.setStatus = function(text)
{
    console.log("[NOI Linux]", text);

    if (!text)
    {
        return;
    }

    const match =
        text.match(/Downloading data.*?\((\d+)\/(\d+)\)/);

    if (match)
    {
        const loaded =
            Number(match[1]);

        const total =
            Number(match[2]);

        const percent =
            total > 0
            ? loaded / total * 100
            : 0;

        statusElement.innerText =
            "正在下载 NOI Linux 环境... " +
            percent.toFixed(1) +
            "%";

        progressElement.style.width =
            percent + "%";

        detailElement.innerText =
            (loaded / 1024 / 1024).toFixed(1) +
            " MB / " +
            (total / 1024 / 1024).toFixed(1) +
            " MB";

        return;
    }

    if (text.includes("Downloading data"))
    {
        statusElement.innerText =
            "正在下载 NOI Linux 环境...";

        return;
    }

    if (text.includes("Running"))
    {
        statusElement.innerText =
            "下载完成，正在启动 Linux...";

        progressElement.style.width =
            "100%";

        return;
    }

    statusElement.innerText = text;
};

async function checkFile(name)
{
    const url =
        new URL(
            name,
            getBaseUrl()
        ).href;

    console.log(
        "[CHECK]",
        name,
        url
    );

    statusElement.innerText =
        "正在检查资源...";

    try
    {
        const response =
            await fetch(
                url,
                {
                    method: "HEAD",
                    cache: "force-cache",
                    credentials: "same-origin"
                }
            );

        console.log(
            "[CHECK RESULT]",
            name,
            response.status,
            response.headers.get("content-type"),
            response.headers.get("content-length")
        );

        if (!response.ok)
        {
            throw new Error(
                name +
                " HTTP " +
                response.status
            );
        }

        const length =
            response.headers.get(
                "content-length"
            );

        if (length)
        {
            console.log(
                "[FILE SIZE]",
                name,
                (Number(length) / 1024 / 1024).toFixed(1) + " MB"
            );
        }

        return true;
    }
    catch (e)
    {
        console.error(
            "[CHECK ERROR]",
            e
        );

        statusElement.innerText =
            "资源加载失败";

        detailElement.innerText =
            name +
            ": " +
            String(e);

        throw e;
    }
}

// 并行检查所有必需的文件
async function checkRequiredFiles()
{
    statusElement.innerText =
        "正在检查 QEMU WASM 和磁盘数据...";

    try
    {
        // 关键改进：使用 Promise.all() 并行执行所有检查
        // 这样不会等待每个文件一个个完成，而是同时发起所有请求
        const results = await Promise.all(
            RESOURCE_FILES.map(checkFile)
        );

        console.log(
            "[FILES CHECK COMPLETE]",
            results
        );

        return true;
    }
    catch (error)
    {
        console.error(
            "[FILES CHECK FAILED]",
            error
        );

        throw error;
    }
}

window.addEventListener(
    "error",
    function(e)
    {
        console.error(
            "[WINDOW ERROR]",
            e
        );

        statusElement.innerText =
            "启动错误";

        detailElement.innerText =
            e.message || String(e.error);
    }
);

window.addEventListener(
    "unhandledrejection",
    function(e)
    {
        console.error(
            "[PROMISE ERROR]",
            e.reason
        );

        statusElement.innerText =
            "启动错误";

        detailElement.innerText =
            String(
                e.reason ||
                "Unknown Promise Error"
            );
    }
);
</script>

<script src="./load.js"></script>

<script type="module">

import "https://unpkg.com/xterm@5.3.0/lib/xterm.js";
import "https://unpkg.com/xterm-pty/index.js";

import "./arg-module.js";

import initEmscriptenModule
    from "./out.js";

const loading =
    document.getElementById(
        "loading"
    );

const terminal =
    new Terminal({
        cursorBlink: true,
        fontSize: 16,
        fontFamily:
            "Consolas, Monaco, monospace",
        scrollback: 5000
    });

terminal.open(
    document.getElementById(
        "terminal"
    )
);

if (!window.crossOriginIsolated)
{
    statusElement.innerText =
        "正在初始化浏览器隔离环境...";

    detailElement.innerText =
        "页面可能自动刷新一次，这是正常现象";
}
else
{
    detailElement.innerText =
        "Cross-Origin Isolation 已启用";
}

const { master, slave } =
    openpty();

terminal.loadAddon(
    master
);

Module.pty =
    slave;

Module["mainScriptUrlOrBlob"] =
    new URL(
        "./out.js",
        getBaseUrl()
    ).href;

let info =
    "t:" +
    Math.round(
        Date.now() / 1000
    ) +
    "\n";

Module["preRun"].push(
    (mod) =>
    {
        try
        {
            mod.FS.mkdir(
                "/pack"
            );
        }
        catch (e)
        {
        }

        mod.FS.writeFile(
            "/pack/info",
            info
        );
    }
);

let readableCallbacks =
    [];

Module.pty.onReadable(
    () =>
    {
        for (
            const callback
            of readableCallbacks
        )
        {
            callback();
        }

        readableCallbacks =
            [];
    }
);

Module["preRun"].push(
    (mod) =>
    {
        mod["TTY"].stream_ops.poll =
            (
                stream,
                timeout,
                notifyCallback
            ) =>
            {
                if (
                    Module.pty.readable
                )
                {
                    return 1;
                }

                if (
                    notifyCallback != null
                )
                {
                    if (
                        notifyCallback
                            .registerCleanupFunc
                    )
                    {
                        notifyCallback
                            .registerCleanupFunc(
                                () =>
                                {
                                    const i =
                                        readableCallbacks
                                            .indexOf(
                                                notifyCallback
                                            );

                                    if (
                                        i != -1
                                    )
                                    {
                                        readableCallbacks
                                            .splice(
                                                i,
                                                1
                                            );
                                    }
                                }
                            );
                    }

                    readableCallbacks.push(
                        notifyCallback
                    );
                }

                return 0;
            };
    }
);

try
{
    // 并行检查所有必需文件
    await checkRequiredFiles();

    statusElement.innerText =
        "正在启动 Ubuntu 20.04...";

    detailElement.innerText =
        "首次启动可能需要较长时间";

    const instance =
        await initEmscriptenModule(
            Module
        );

    console.log(
        "[NOI Linux]",
        "启动完成",
        instance
    );

    loading.style.display =
        "none";

    terminal.focus();
}
catch (e)
{
    console.error(
        "[BOOT ERROR]",
        e
    );

    statusElement.innerText =
        "NOI Linux 启动失败";

    detailElement.innerText =
        String(e);
}

</script>

</body>
</html>
