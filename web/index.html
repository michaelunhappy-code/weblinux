<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOI Linux Web</title>
    <script src="./coi-serviceworker.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/@xterm/xterm@5.5.0/css/xterm.css">
    <style>
        html,
        body
        {
            width: 100%;
            height: 100%;
            margin: 0;
            background: #111;
            overflow: hidden;
        }
        #terminal
        {
            width: 100%;
            height: 100%;
        }
        #loading
        {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #111;
            color: white;
            font-family: Consolas, monospace;
            z-index: 100;
        }
        #title
        {
            font-size: 30px;
            margin-bottom: 24px;
        }
        #status
        {
            font-size: 16px;
            margin-bottom: 16px;
        }
        #bar
        {
            width: 420px;
            max-width: 80vw;
            height: 10px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
        }
        #progress
        {
            width: 0%;
            height: 100%;
            background: #ddd;
            transition: width 0.2s;
        }
        #detail
        {
            margin-top: 12px;
            font-size: 13px;
            opacity: 0.7;
        }
    </style>
</head>
<body>

<div id="loading">
    <div id="title">NOI Linux</div>
    <div id="status">正在准备启动环境...</div>
    <div id="bar">
        <div id="progress"></div>
    </div>
    <div id="detail"></div>
</div>

<div id="terminal"></div>

<script>
var Module = window.Module = window.Module || {};

const statusElement = document.getElementById("status");
const progressElement = document.getElementById("progress");
const detailElement = document.getElementById("detail");

Module.locateFile = function(path)
{
    return new URL(path, document.baseURI).href;
};

Module.setStatus = function(text)
{
    console.log("[NOI Linux]", text);

    if (!text)
    {
        return;
    }

    const match = text.match(/Downloading data.*?\((\d+)\/(\d+)\)/);

    if (match)
    {
        const loaded = Number(match[1]);
        const total = Number(match[2]);

        const percent = total > 0 ? loaded / total * 100 : 0;

        statusElement.innerText =
            "正在下载 NOI Linux 环境... " +
            percent.toFixed(1) + "%";

        progressElement.style.width =
            percent + "%";

        detailElement.innerText =
            (loaded / 1024 / 1024).toFixed(1) +
            " MB / " +
            (total / 1024 / 1024).toFixed(1) +
            " MB";

        return;
    }

    if (text === "Downloading data...")
    {
        statusElement.innerText =
            "正在下载 NOI Linux 环境...";
        return;
    }

    if (text === "Running...")
    {
        statusElement.innerText =
            "下载完成，正在启动 Linux...";
        progressElement.style.width = "100%";
        return;
    }

    statusElement.innerText = text;
};

window.addEventListener("error", function(e)
{
    statusElement.innerText = "启动错误";
    detailElement.innerText = e.message;
    console.error(e);
});

window.addEventListener("unhandledrejection", function(e)
{
    statusElement.innerText = "启动错误";
    detailElement.innerText =
        String(e.reason || e);

    console.error(e.reason);
});
</script>

<script src="./load.js"></script>

<script type="module">

import "https://unpkg.com/xterm@5.3.0/lib/xterm.js";
import "https://unpkg.com/xterm-pty/index.js";

import "./arg-module.js";

import initEmscriptenModule from "./out.js";

const loading =
    document.getElementById("loading");

const statusElement =
    document.getElementById("status");

const detailElement =
    document.getElementById("detail");

if (!window.crossOriginIsolated)
{
    statusElement.innerText =
        "正在初始化浏览器运行环境...";

    detailElement.innerText =
        "如果页面自动刷新一次，这是正常现象";
}

const terminal = new Terminal({
    cursorBlink: true,
    fontSize: 16,
    fontFamily: "Consolas, monospace",
    scrollback: 5000
});

terminal.open(
    document.getElementById("terminal")
);

const { master, slave } = openpty();

terminal.loadAddon(master);

Module.pty = slave;

Module["mainScriptUrlOrBlob"] =
    new URL(
        "./out.js",
        document.baseURI
    ).href;

let info =
    "t:" +
    Math.round(Date.now() / 1000) +
    "\n";

Module["preRun"].push((mod) =>
{
    try
    {
        mod.FS.mkdir("/pack");
    }
    catch (e)
    {
    }

    mod.FS.writeFile(
        "/pack/info",
        info
    );
});

let readableCallbacks = [];

Module.pty.onReadable(() =>
{
    readableCallbacks.forEach(
        cb => cb()
    );

    readableCallbacks = [];
});

Module["preRun"].push((mod) =>
{
    mod["TTY"].stream_ops.poll =
        (
            stream,
            timeout,
            notifyCallback
        ) =>
        {
            if (Module.pty.readable)
            {
                return 1;
            }

            if (notifyCallback != null)
            {
                notifyCallback.registerCleanupFunc(
                    () =>
                    {
                        const i =
                            readableCallbacks.indexOf(
                                notifyCallback
                            );

                        if (i != -1)
                        {
                            readableCallbacks.splice(
                                i,
                                1
                            );
                        }
                    }
                );

                readableCallbacks.push(
                    notifyCallback
                );
            }

            return 0;
        };
});

try
{
    const instance =
        await initEmscriptenModule(Module);

    loading.style.display = "none";

    terminal.focus();
}
catch (e)
{
    console.error(e);

    statusElement.innerText =
        "NOI Linux 启动失败";

    detailElement.innerText =
        String(e);
}

</script>

</body>
</html>
