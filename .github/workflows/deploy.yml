name: Build NOI Linux Web

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build NOI Linux image
        run: |
          docker build -t noi-linux-web:latest .

      - name: Install container2wasm
        run: |
          URL=$(curl -fsSL \
            https://api.github.com/repos/container2wasm/container2wasm/releases/latest \
            | jq -r '.assets[] |
            select(.name | test("linux-amd64.tar.gz$")) |
            .browser_download_url' |
            head -n 1)

          echo "$URL"

          curl -L "$URL" -o c2w.tar.gz

          tar -xzf c2w.tar.gz

          sudo install c2w /usr/local/bin/c2w

          c2w --version

      - name: Build browser Linux
        run: |
          mkdir -p dist

          c2w \
            --to-js \
            noi-linux-web:latest \
            dist/

      - name: Add website
        run: |
          cp web/index.html dist/index.html

          curl -L \
            https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/master/coi-serviceworker.min.js \
            -o dist/coi-serviceworker.min.js

          touch dist/.nojekyll

          echo "Generated files:"
          du -sh dist
          ls -lh dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
