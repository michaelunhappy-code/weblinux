name: Build NOI Linux Web

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build NOI Linux image
        run: |
          set -euxo pipefail
          docker build -t noi-linux-web:latest .

      - name: Install container2wasm
        run: |
          set -euxo pipefail
          curl -fL \
            https://github.com/container2wasm/container2wasm/releases/download/v0.8.4/container2wasm-v0.8.4-linux-amd64.tar.gz \
            -o c2w.tar.gz

          tar -xzf c2w.tar.gz

          sudo install -m 0755 c2w /usr/local/bin/c2w

          c2w --version

      - name: Build browser Linux
        run: |
          set -euxo pipefail

          mkdir -p dist

          c2w \
            --to-js \
            --build-arg SOURCE_REPO=https://github.com/container2wasm/container2wasm \
            --build-arg SOURCE_REPO_VERSION=v0.8.4 \
            noi-linux-web:latest \
            dist/

      - name: Add website
        run: |
          set -euxo pipefail

          cp web/index.html dist/index.html

          curl -fL \
            https://raw.githubusercontent.com/gzuidhof/coi-serviceworker/master/coi-serviceworker.min.js \
            -o dist/coi-serviceworker.min.js

          touch dist/.nojekyll

          echo "Generated files:"
          du -sh dist
          ls -lah dist

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
